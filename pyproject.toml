[project]
name = "airllm-lab"
version = "0.1.0"
description = "Exhaustive AirLLM lab: benchmarks, thin wrapper, notebooks"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "airllm==4.0.1",
    "torch>=2.4",
    "transformers>=4.49,<6",
    "accelerate>=1.0",
    "safetensors",
    "huggingface-hub",
    "scipy",
    "sentencepiece",
    "jupytext>=1.16",
    "papermill>=2.6",
    "ipykernel>=6.29",
    "mlx==0.32.4",
]

[project.optional-dependencies]
dev = []

[dependency-groups]
dev = ["pytest", "pytest-cov"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true

[tool.jupytext]
formats = "notebooks//ipynb,notebooks//py:percent"

[tool.hatch.build.targets.wheel]
packages = ["src/airllm_lab"]

[tool.pytest.ini_options]
markers = [
  "scenario: feature/use-case scenario tag",
  "dep: external-dependency tag",
  "negative: negative-path tag",
]
